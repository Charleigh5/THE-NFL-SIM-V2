name: E2E Tests

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5

      - name: Install backend dependencies
        run: cd backend && pip install -r requirements.txt

      - name: Start backend
        run: cd backend && uvicorn app.main:app &

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright
        run: cd frontend && npx playwright install --with-deps

      - name: Run E2E tests
        run: cd frontend && npm run test:e2e

      - name: Prepare bounded E2E failure artifact
        if: failure()
        id: prepare-e2e-artifact
        shell: bash
        run: |
          set -euo pipefail
          report_dir="frontend/playwright-report"
          max_bytes=$((25 * 1024 * 1024))
          echo "upload=false" >> "$GITHUB_OUTPUT"

          if [[ ! -d "$report_dir" ]]; then
            echo "No Playwright report directory exists; nothing to upload."
            exit 0
          fi

          size_bytes=$(du -sb "$report_dir" | cut -f1)
          echo "Initial Playwright report size: ${size_bytes} bytes"

          if (( size_bytes > max_bytes )); then
            echo "Report exceeds 25 MiB; pruning video/trace payloads before upload."
            find "$report_dir" -type f \
              \( -name '*.webm' -o -name '*.mp4' -o -name '*.zip' -o -name '*.trace' \) \
              -delete || true
            size_bytes=$(du -sb "$report_dir" | cut -f1)
            echo "Pruned Playwright report size: ${size_bytes} bytes"
          fi

          echo "size_bytes=${size_bytes}" >> "$GITHUB_OUTPUT"
          if (( size_bytes <= max_bytes )); then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Playwright report still exceeds 25 MiB after pruning; upload skipped to protect Actions storage."
          fi

      - name: Upload bounded E2E failure report
        if: failure() && steps.prepare-e2e-artifact.outputs.upload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 3
          if-no-files-found: ignore
