name: Spatial Prettier Preview

on:
  pull_request:
    branches: [main]

jobs:
  format-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Emit canonical Prettier output
        run: |
          npx prettier --write src/components/spatial/SpatialSceneShell.module.css src/pages/DepthChartSpatial.css
          echo "=== SPATIAL_SHELL_BEGIN ==="
          cat src/components/spatial/SpatialSceneShell.module.css
          echo "=== SPATIAL_SHELL_END ==="
          echo "=== DEPTH_SPATIAL_BEGIN ==="
          cat src/pages/DepthChartSpatial.css
          echo "=== DEPTH_SPATIAL_END ==="
